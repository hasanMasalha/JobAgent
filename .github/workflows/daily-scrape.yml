name: Run Scrape (manual)

# The daily scrape is scheduled on the server (ai-service/scheduler.py, 05:00
# UTC: scrape → Active Jobs DB → match). This workflow used to start it a second
# time at the same minute. Now it only starts an extra run by hand; the server
# refuses (409) while a scrape is already running.
#
# With wait_for_result it then checks /scrape-and-store/status every minute and
# prints the result and timing report when the run ends. The scrape itself
# runs in the background on the server either way: if this job times out, the
# scrape carries on.
#
# Don't run "Check FastAPI Logs" during a scrape: it rebuilds the container.

on:
  workflow_dispatch:
    inputs:
      skip_known:
        description: "Skip detail pages of LinkedIn jobs already stored (false = visit all, to measure the full cost)"
        type: boolean
        default: true
      wait_for_result:
        description: "Wait for the run to finish and print its timing report"
        type: boolean
        default: true

jobs:
  scrape:
    name: Start scrape
    runs-on: ubuntu-latest
    timeout-minutes: 125

    steps:
      - name: Start a background scrape on the server (and wait for its report)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 120m
          script: |
            KEY="$(grep '^INTERNAL_API_KEY=' /home/ubuntu/jobagent/.env | cut -d= -f2-)"
            STATUS_URL="http://localhost:8000/scrape-and-store/status"
            curl -s -X POST -H "X-Internal-Key: $KEY" \
              "http://localhost:8000/scrape-and-store?skip_known=${{ inputs.skip_known }}" --max-time 30
            echo
            if [ "${{ inputs.wait_for_result }}" != "true" ]; then
              echo "Started (or already running). Status: $STATUS_URL"
              exit 0
            fi
            for i in $(seq 1 115); do
              sleep 60
              S="$(curl -s -H "X-Internal-Key: $KEY" "$STATUS_URL" --max-time 20)"
              case "$S" in
                *'"running":true'*) echo "$(date -u +%H:%M) running ($i min)";;
                *) break;;
              esac
            done
            echo "=== Final status and timing report ==="
            echo "$S" | python3 -m json.tool 2>/dev/null || echo "$S"
