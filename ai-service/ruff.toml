# Ruff's default rule set (no `select` here) grows between releases, so an
# unpinned ruff fails CI on code that passed locally. One version everywhere:
# ai-service/requirements.txt pins it, CI installs that line, and ruff refuses
# to run at any other version. Upgrade all three together.
required-version = "==0.17.0"

[lint]
ignore = [
    "UP017",
    "BLE001",   # blind exception catch - intentional in scraper code
    "S110",     # try-except-pass - intentional
    "S112",     # try-except-continue - intentional
    "ASYNC230", # blocking open in async - acceptable
    "SIM102",   # nested if - readability preference
    "SIM103",   # return condition - readability preference
    "SIM117",   # nested with - readability preference
    "DTZ005",   # datetime.now() without tz - acceptable
    "RUF010",   # explicit conversion flag - style preference
    "RUF100",   # unused noqa - cleanup separately
    "C401",     # unnecessary generator - style preference
    "I001",     # import sorting - handled separately
]
